plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.phoenix.tunnel'
    compileSdk 34

    defaultConfig {
        applicationId "ir.phoenix.tunnel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    // AAR هسته‌ی Go — تولید:
    // gomobile bind -target=android -javapkg ir.phoenix.core \
    //   -o android-app/app/libs/phoenix.aar github.com/phoenixtunnel/phoenix/client
    implementation files('libs/phoenix.aar')
}
